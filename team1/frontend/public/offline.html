<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2C5F9F" />
    <title>MEDviz - Offline</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 2rem;
      }
      h1 {
        color: #2c5f9f;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b7280;
        line-height: 1.5;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo192.png" alt="MEDviz" />
      <h1>You're offline</h1>
      <p>
        MEDviz can't reach the network right now. Check your connection and try
        again — your app will reload automatically once you're back online.
      </p>
    </div>
  </body>
</html>
